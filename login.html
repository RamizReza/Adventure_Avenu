<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./brostrap/css/bootstrap.min.css">
    <title>AdventureAvenu-login or sing up</title>
    
<link rel="icon" type="image/png" sizes="32x32" href="/Logo/6-61387_travel-euclidean-vector-royalty-free-clip-art-travel (1).png">

   
</head>


<style>
 body {
     background-color: lightgrey;
      font-family: Arial, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; margin: 0; }

      .talk { text-align: center;
       padding: 50px; 
       border: 1px solid black; 
       border-radius: 5px; 
       background-color: white; 
       box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3); } 
       
       .search-button { background-color: darkcyan;
        color: white;
         font-size: 20px; 
         border: none;
          padding: 15px 32px; 
          text-align: center;
           text-decoration: none;
            display: inline-block; 
            font-family: Arial, sans-serif;
             margin: 4px 2px; cursor: pointer; border-radius: 5px; }

       .login input[type="text"],
       .login input[type="password"] {
           width: 300px;
           max-width: 100%;
           padding: 10px 14px;
           border: 1px solid #ccc;
           border-radius: 5px;
           font-size: 16px;
           box-sizing: border-box;
       }

       #loginAlert {
           display: none;
           max-width: 320px;
           margin: 0 auto 15px auto;
           padding: 10px 14px;
           border-radius: 5px;
           font-size: 14px;
           text-align: center;
       }
       .alert-error {
           background-color: #ffebee;
           color: #c62828;
           border: 1px solid #ef9a9a;
       }
       .alert-success {
           background-color: #e8f5e9;
           color: #2e7d32;
           border: 1px solid #a5d6a7;
       }
</style>

<body> 
    <div class="talk">
<h1 style="color: darkcyan ; font-size: 38px;"><b><i>AdventureAvenu</i></b></h1>
<p style="font-size: 30px;">AdventureAvenu help's to make your trip easy and beautiful.</p>
   
   <div id="loginAlert"></div>

   <div class="login">
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <input type="text" id="Email address or phone number " name="email" placeholder="Email address or phone number " required><br><br>
        <input type="password" id="Password" name="password" placeholder="Password" required><br><br>

        <input type="submit" id="loginSubmitBtn" class="search-button" value="Login" />
    </form>
 
    <form action="./singup.html" method="get">
        <input type="submit" class="search-button" value="Creat Account" />
    </form> 
    
   </div>
    
</div>
</body>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

<script>
const API_BASE = (window.location.protocol === 'file:' || (window.location.port !== '8000' && window.location.port !== ''))
    ? 'http://localhost:8000'
    : '';

async function handleLoginSubmit(event) {
    event.preventDefault();
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const emailInput = document.getElementById('Email address or phone number ');
    const passwordInput = document.getElementById('Password');

    const email = (emailInput.value || '').trim();
    const password = passwordInput.value || '';

    if (!email || !password) {
        showAlert('Please enter both email and password.', 'error');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.value = 'Logging in...';

    try {
        const response = await fetch(`${API_BASE}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email: email, password: password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            if (data.token) {
                localStorage.setItem('adv_session_token', data.token);
            }
            showAlert('Login successful! Welcome back, ' + (data.user.name || 'Traveler') + '.', 'success');
            setTimeout(() => {
                window.location.href = './home.html';
            }, 800);
        } else {
            showAlert(data.error || 'Invalid email/phone or password. Please try again.', 'error');
            submitBtn.disabled = false;
            submitBtn.value = 'Login';
        }
    } catch (err) {
        console.error('Login request error:', err);
        showAlert('Could not connect to the backend server. Please verify the server is running.', 'error');
        submitBtn.disabled = false;
        submitBtn.value = 'Login';
    }
}

function showAlert(message, type) {
    const alertBox = document.getElementById('loginAlert');
    alertBox.textContent = message;
    alertBox.className = type === 'success' ? 'alert-success' : 'alert-error';
    alertBox.style.display = 'block';
}
</script>

</html>
